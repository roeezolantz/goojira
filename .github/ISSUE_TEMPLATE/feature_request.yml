name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the frustration or gap you're hitting?
      placeholder: Today, when I try to X, I have to Y, which is slow / annoying / impossible.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried, or alternative designs you thought about.

  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR for this
          required: false
